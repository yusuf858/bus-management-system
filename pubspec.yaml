name: bus_management_system
description: A production-ready bus tracking and management system with Firebase integration.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.15.3
  firebase_database: ^10.4.0
  firebase_messaging: ^14.7.9

  # State Management
  provider: ^6.1.1

  # Google Maps
  google_maps_flutter: ^2.5.0

  # HTTP
  http: ^1.1.2

  geolocator: ^10.1.0  # ← ADD THIS LINE
  permission_handler: ^11.0.1

  # UI
  cupertino_icons: ^1.0.2

  # Utilities
  intl: ^0.18.1
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true